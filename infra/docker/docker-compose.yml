version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: warkopyareh_db
    environment:
      POSTGRES_USER: warkopyareh
      POSTGRES_PASSWORD: warkopyareh_pass
      POSTGRES_DB: warkopyareh_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warkopyareh -d warkopyareh_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: warkopyareh_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: warkopyareh_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: warkopyareh_backend
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://warkopyareh:warkopyareh_pass@postgres:5432/warkopyareh_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "4000:4000"
    volumes:
      - ../../:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
