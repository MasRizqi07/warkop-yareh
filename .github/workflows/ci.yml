name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma output is intentionally gitignored and must be generated for
      # the runner platform before typechecking or building.
      - name: Generate Prisma Client
        run: pnpm --filter @warkop-yareh/database run db:generate

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm turbo run test
        env:
          # Dummy values only — no real DB/Redis container here because every
          # spec Claude inspected mocks PrismaService directly. If a real
          # integration/e2e suite against a live Postgres gets added later,
          # add a `services: postgres:` block then — not before (YAGNI).
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
          JWT_SECRET: ci-placeholder-secret-not-for-real-use-min-32-chars
          JWT_REFRESH_SECRET: ci-placeholder-refresh-secret-not-for-real-use
          MIDTRANS_SERVER_KEY: ci-placeholder-midtrans-key
          NODE_ENV: test
