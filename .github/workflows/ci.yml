name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: warkop_audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d warkop_audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/warkop_audit
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-placeholder-secret-not-for-real-use-min-32-chars
      JWT_REFRESH_SECRET: ci-placeholder-refresh-secret-not-for-real-use
      MIDTRANS_SERVER_KEY: ci-placeholder-midtrans-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma output is intentionally gitignored and must be generated for
      # the runner platform before typechecking or building.
      - name: Generate Prisma Client
        run: pnpm --filter @warkop-yareh/database run db:generate

      - name: Migrate isolated integration database
        run: pnpm --filter @warkop-yareh/database run db:migrate:deploy

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Build
        run: pnpm turbo run build

      # api#test depends on uncached test:checkout (one worker) in turbo.json.
      - name: Unit tests and checkout persistence / concurrency / RLS
        run: pnpm turbo run test
        env:
          NODE_ENV: test

      - name: API application E2E
        run: pnpm --filter @warkop-yareh/api run test:e2e
        env:
          NODE_ENV: test
