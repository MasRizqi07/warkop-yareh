name: CD

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm --filter @warkop-yareh/database db:generate

      - name: Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @warkop-yareh/database db:migrate

      - name: Build and Deploy API (ECS Fargate)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Deploying NestJS API container..."
          # docker build -t warkop-yareh-api -f apps/api/Dockerfile .
          # docker push ...

      - name: Build and Deploy Frontend (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Deploying Next.js applications to Vercel..."
          # pnpm vercel deploy --prod --token=$VERCEL_TOKEN
